<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="af-shield-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="af-flow-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="af-core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="af-subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Faceted Shield Boundary -->
  <path d="M50 8 L84 22 V48 C84 68 69 84 50 92 C31 84 16 68 16 48 V22 L50 8Z" 
        stroke="url(#af-shield-grad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        fill="#0B132B" 
        fill-opacity="0.8" 
        filter="url(#af-subtle-glow)" />

  <!-- Inner Dynamic Convergent Flow Chevron (Aegis + Flow 'A') -->
  <path d="M50 20 L72 32 V47 C72 61 61 73 50 79 C39 73 28 61 28 47 V32 L50 20Z" 
        stroke="rgba(255,255,255,0.08)" 
        stroke-width="1.5" 
        fill="#0F172A" 
        fill-opacity="0.9" />

  <!-- Flow Vector Rays (representing pipelines & verification loops) -->
  <path d="M50 26 L66 54 H55 L58 71 L34 44 H45 L50 26Z" 
        fill="url(#af-flow-grad)" />

  <!-- Cryptographic Core Verification Node -->
  <circle cx="50" cy="52" r="3.5" fill="#FFFFFF" />
  <circle cx="50" cy="52" r="6" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" fill="none" />
</svg>
