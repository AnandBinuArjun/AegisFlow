name: AegisFlow CI & Security Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Code Quality & Security Check
        run: |
          ruff check .
          ruff format --check .

      - name: MyPy Static Type Check
        run: |
          mypy apps packages workers

      - name: Initialize Database Schema
        run: |
          python -c "import asyncio; from apps.api.database import init_db; asyncio.run(init_db())"

      - name: Run Test Suite (Unit, Security, Secret Scanner)
        run: |
          pytest -v --cov=apps --cov=packages --cov-report=term-missing

      - name: Verify Deliberate Failure Gate
        run: |
          echo "Testing that CI fails when AEGIS_FAIL_TEST is set..."
          if AEGIS_FAIL_TEST=1 pytest tests/unit/test_deliberate_failure.py; then
            echo "ERROR: Test should have failed under deliberate failure mode!"
            exit 1
          else
            echo "SUCCESS: Test failure gate operated properly."
          fi

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Build TypeScript & Vite Assets
        working-directory: apps/web
        run: |
          npm run build
